services:
  api:
    build: .
    command: uvicorn aie_engine.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [postgres, redis, minio]
  worker:
    build: .
    command: celery -A aie_engine.workers.worker.celery worker --loglevel=INFO --queues=cpu
    env_file: .env
    depends_on: [postgres, redis, minio]
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: aie, POSTGRES_PASSWORD: aie, POSTGRES_DB: aie}
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis: {image: redis:7-alpine}
  minio:
    image: minio/minio
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    ports: ["9000:9000", "9001:9001"]
volumes: {postgres_data: {}}
