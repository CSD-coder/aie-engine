[project]
name = "aie-engine"
version = "1.0.0"
description = "ai.Encrypt production model optimisation backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "celery[redis]>=5.4,<6",
  "boto3>=1.35,<2", "safetensors>=0.4,<1", "numpy>=1.26,<3", "httpx>=0.27,<1"
]
[project.optional-dependencies]
ml = ["torch>=2.4", "transformers>=4.45", "huggingface-hub>=0.25", "accelerate>=0.34"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
